<!DOCTYPE html>
<html>

<head>
    <title>Flood Prediction System</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>🌊 Flood Prediction System</h1>

    <p>AI-Powered Flood Risk Prediction using Machine Learning</p>

    <hr><br>

    <form action="/predict" method="POST">

        <input type="number" step="any" name="Temp" placeholder="Temperature (°C)" required>

        <input type="number" step="any" name="Humidity" placeholder="Humidity (%)" required>

        <input type="number" step="any" name="Cloud Cover" placeholder="Cloud Cover (%)" required>

        <input type="number" step="any" name="ANNUAL" placeholder="Annual Rainfall (mm)" required>

        <input type="number" step="any" name="Jan-Feb" placeholder="Jan-Feb Rainfall (mm)" required>

        <input type="number" step="any" name="Mar-May" placeholder="Mar-May Rainfall (mm)" required>

        <input type="number" step="any" name="Jun-Sep" placeholder="Jun-Sep Rainfall (mm)" required>

        <input type="number" step="any" name="Oct-Dec" placeholder="Oct-Dec Rainfall (mm)" required>

        <input type="number" step="any" name="avgjune" placeholder="Average June Rainfall (mm)" required>

        <input type="number" step="any" name="sub" placeholder="Subdivision Rainfall (mm)" required>

        <input type="submit" value="🔍 Predict Flood Risk">

    </form>

    {% if prediction %}
    <div class="result">
        {{ prediction }}
    </div>
    {% endif %}

    <div class="footer">
        <p>Developed for SmartBridge AI/ML Project | Flood Prediction System</p>
    </div>

</div>

</body>

</html>
